name: Flutter CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build e Validação
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Java JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '11'

      - name: Configurar ambiente Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'

      - name: Opção Nuclear - Recriar Android V2 no Servidor
        run: |
          # 1. Salvar permissões atuais de Bluetooth (ignora erro se não achar)
          grep "<uses-permission" android/app/src/main/AndroidManifest.xml > perms.txt || true
          
          # 2. Destruir a pasta problemática vinda do Git
          rm -rf android/
          
          # 3. Recriar a pasta nativa V2 fresca na nuvem
          flutter create --platforms=android .
          
          # 4. Injetar as permissões de Bluetooth de volta no novo Manifesto
          if [ -s perms.txt ]; then
            sed -i '/<manifest/r perms.txt' android/app/src/main/AndroidManifest.xml
          else
            sed -i '/<manifest/a \    <uses-permission android:name="android.permission.BLUETOOTH" />\n    <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" />\n    <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />\n    <uses-permission android:name="android.permission.BLUETOOTH_SCAN" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />' android/app/src/main/AndroidManifest.xml
          fi

      - name: Instalar dependências
        run: flutter pub get

      - name: Hack CI - Remover jcenter() dos pacotes antigos
        run: find /home/runner/.pub-cache/ -name "build.gradle" -type f -exec sed -i 's/jcenter()/mavenCentral()/g' {} + || true

      - name: Verificar formatação e análise estática
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Compilar APK (Release)
        run: flutter build apk --release

      - name: Salvar APK gerado como Artefato
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk