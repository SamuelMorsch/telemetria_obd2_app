name: Flutter CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build e Validação
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Java JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '11'

      - name: Configurar ambiente Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'

      - name: Instalar dependências
        run: flutter pub get

      - name: Hack CI - Modernizar pacotes legados
        run: find /home/runner/.pub-cache/hosted/ -name "build.gradle" -type f -exec sed -i 's/jcenter()/mavenCentral()/g' {} + || true

      - name: Verificar formatação e análise estática
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Compilar APK (Release)
        run: flutter build apk --release

      - name: Salvar APK gerado como Artefato
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk