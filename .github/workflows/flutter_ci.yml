name: CI - App Android

on:
  push:
    branches: [main, v2]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Cancela execuções antigas da mesma branch quando chega um commit novo.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualidade:
    name: Análise estática e testes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Flutter 3.44.0 (mesma versão do desenvolvimento)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.0"
          channel: stable
          cache: true

      - name: Versões usadas (para reproduzir localmente)
        run: flutter --version

      - name: Dependências
        run: flutter pub get

      - name: Análise estática
        run: flutter analyze --no-fatal-infos

      - name: Testes automatizados (com cobertura)
        run: flutter test --coverage

      - name: Guardar cobertura (usada depois pelo SonarCloud)
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-lcov
          path: coverage/lcov.info
          if-no-files-found: warn

  apk:
    name: Compilar APK
    needs: qualidade
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      # AGP 9 e Gradle 9 exigem JDK 17 ou superior.
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Flutter 3.44.0 (mesma versão do desenvolvimento)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.0"
          channel: stable
          cache: true

      - name: Dependências
        run: flutter pub get

      - name: APK de release
        run: flutter build apk --release

      - name: Guardar o APK gerado
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
