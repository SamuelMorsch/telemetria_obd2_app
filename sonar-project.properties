sonar.organization=samuelmorsch
sonar.projectKey=SamuelMorsch_telemetria_obd2_app
sonar.projectName=telemetria_obd2_app
sonar.sourceEncoding=UTF-8

# Código da aplicação e testes (third_party/ é o plugin Bluetooth de terceiros e fica fora da análise)
