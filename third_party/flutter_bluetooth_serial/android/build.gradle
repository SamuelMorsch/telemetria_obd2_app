// CÓPIA MANTIDA NO REPOSITÓRIO. Ver ../VENDORED.md
// Alterações em relação ao pacote publicado (0.4.0): jcenter() -> mavenCentral(), Kotlin 1.8.0,
// Android Gradle Plugin 7.4.2 (classpath), namespace e compileSdkVersion 34.
group 'io.github.edufolly.flutterbluetoothserial'
version '1.0-SNAPSHOT'
buildscript {
    ext.kotlin_version = '1.8.0' // antes: 1.3.50
    repositories {
        google()
        mavenCentral() // antes: jcenter() (removido no Gradle 9)
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:7.4.2' // antes: 3.x
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}
rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}
apply plugin: 'com.android.library'
android {
    namespace 'io.github.edufolly.flutterbluetoothserial'
    compileSdkVersion 34
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    defaultConfig {
        minSdkVersion 19
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    lintOptions {
        disable 'InvalidPackage'
    }
    dependencies {
        implementation 'androidx.appcompat:appcompat:1.3.0'
    }
    buildToolsVersion '30.0.3'
}

dependencies {
}
